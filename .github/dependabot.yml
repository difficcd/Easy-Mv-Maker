# Dependency updates, weekly.
#
# The point is not to be on the newest of everything - it is that a security advisory against
# something in the tree should arrive as a pull request that CI has already run, rather than
# being noticed months later. Grouped so a quiet week is one PR to look at instead of six.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are read together; a major goes on its own, because that is the
      # one that needs the release notes read.
      routine:
        update-types: [minor, patch]
      # Packages that peer-depend on each other have to move together or not at all. Bumping one
      # half produces a pull request that cannot install - which is what happened on the first
      # run: react-dom 19 against react 18, and @capacitor/android 8 against @capacitor/core 7.
      # Both were correctly rejected by CI, but they were never mergeable, and reviewing a broken
      # pull request costs the same as reviewing a real one.
      # The react group has to include what peers on react, not just react itself. Grouping
      # react + react-dom was not enough: bumping them to 19 produced a pull request that could
      # not install, because lucide-react 0.x peers at react <=18. Anything that declares a react
      # peer belongs here.
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'lucide-react']
      capacitor:
        patterns: ['@capacitor/*']
      # Same shape again: @vitejs/plugin-react 6 requires vite 7, so on its own it is unmergeable.
      vite:
        patterns: ['vite', '@vitejs/*', 'vite-plugin-*']
    commit-message:
      prefix: 'chore(deps)'

  # Actions pinned to a major tag still move underneath you; this is how a deprecated runner
  # version or a compromised action gets noticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
