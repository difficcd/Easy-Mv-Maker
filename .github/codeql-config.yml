name: Easy MV Maker

# What is worth analysing, and what is not.
#
# `scripts/` is developer tooling: it downloads fonts, rebuilds the icon, checks the helper index.
# None of it ships, none of it runs on a server, and all of it runs only when somebody types the
# command. Analysing it produced findings like "network data written to file" for a script whose
# entire job is to download a font and write it to disk - true, and not a risk anybody can act on.
# Leaving those open trains people to click past alerts, which is worse than not having them.
#
# `dist/` and `build/` are outputs. `android/` is generated by Capacitor from the same source that
# is already analysed.
paths-ignore:
  - scripts
  - dist
  - build
  - android
